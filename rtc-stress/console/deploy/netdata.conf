[global]
    run as user = netdata
    update every = 1

[db]
    mode = dbengine
    storage tiers = 1
    dbengine tier 0 retention size = 128 MiB
    dbengine tier 0 retention time = 1h

[web]
    bind to = 127.0.0.1
    default port = 19999
    allow connections from = localhost 127.*
    allow dashboard from = localhost 127.*
    allow management from = localhost 127.*

[plugins]
    enable running new plugins = no
    proc = yes
    diskspace = no
    cgroups = no
    tc = no
    idlejitter = no
    timex = no
    checks = no
    apps = no
    debugfs = no
    ebpf = no
    perf = no
    go.d = no
    python.d = no
    charts.d = no
    statsd = no
    systemd-journal = no
    systemd-units = no
    network-viewer = no
    slabinfo = no
    dem = no

[health]
    enabled = no

[ml]
    enabled = no

[logs]
    daemon = stderr
    collector = stderr
    access = off
    health = off
    level = warning
